name: Idea
description: Something the app could do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like
      description: What you are trying to do, and what is in the way now.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it could work
      description: Optional - a sketch, a screenshot, how another app does it.
